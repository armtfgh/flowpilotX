name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      # Private study fixtures are intentionally absent from a public clone.
      # The helper explicitly selects the synthetic suites, verifies both
      # installed packages/assets, and checks the restored backbone source.
      - run: python -B tools/run_public_tests.py --installed
      - run: python tools/check_release.py
